name: macOS Universal Internal Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-universal-internal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Enable pinned Corepack and pnpm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --force corepack@0.31.0
          corepack enable
          test "$(corepack --version)" = "0.31.0"
          corepack prepare pnpm@10.12.3 --activate
          test "$(node --version)" = "v22.12.0"
          test "$(pnpm --version)" = "10.12.3"

      - name: Setup Rust Apple targets
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: rustfmt,clippy

      - name: Verify Rust toolchain and targets
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = "1.95.0"
          rustup target add x86_64-apple-darwin
          rustup target list --installed | sort > /tmp/targets.txt
          grep -Fx aarch64-apple-darwin /tmp/targets.txt
          grep -Fx x86_64-apple-darwin /tmp/targets.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend format check
        run: pnpm format:check

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Frontend unit tests
        run: pnpm test:unit

      - name: Renderer build
        run: pnpm build:renderer

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Universal DMG
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg

      - name: Verify Universal app architecture
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir='src-tauri/target/universal-apple-darwin/release/bundle/macos'
          shopt -s nullglob
          apps=("$bundle_dir"/*.app)
          test "${#apps[@]}" -eq 1
          executable='src-tauri/target/universal-apple-darwin/release/agent-manager'
          test -s "$executable"
          file "$executable"
          python3 - "$executable" <<'PY'
          import struct
          import sys
          from pathlib import Path

          executable = Path(sys.argv[1])
          data = executable.read_bytes()
          if len(data) < 8:
              raise SystemExit("Mach-O executable is too small")

          magic, count = struct.unpack_from(">II", data)
          formats = {
              0xCAFEBABE: (">iiIII", 20),
              0xCAFEBABF: (">iiQQII", 32),
          }
          if magic not in formats:
              raise SystemExit(f"Expected a big-endian Mach-O FAT header, got 0x{magic:08x}")
          if count != 2:
              raise SystemExit(f"Expected exactly two Mach-O slices, got {count}")

          entry_format, entry_size = formats[magic]
          offset = 8
          cpu_types = []
          for index in range(count):
              if offset + entry_size > len(data):
                  raise SystemExit(f"Truncated Mach-O FAT entry {index}")
              entry = struct.unpack_from(entry_format, data, offset)
              cpu_type, _, slice_offset, slice_size = entry[:4]
              if slice_size <= 0 or slice_offset + slice_size > len(data):
                  raise SystemExit(f"Invalid Mach-O slice bounds for entry {index}")
              cpu_types.append(cpu_type & 0xFFFFFFFF)
              offset += entry_size

          expected = [0x01000007, 0x0100000C]  # x86_64, arm64
          if sorted(cpu_types) != expected:
              observed = ", ".join(f"0x{value:08x}" for value in sorted(cpu_types))
              raise SystemExit(f"Unexpected Mach-O CPU types: {observed}")
          print("Verified Universal Mach-O architectures: arm64 x86_64")
          PY

      - name: Assemble internal artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$GITHUB_WORKSPACE/internal-artifacts"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"
          bundle_dir='src-tauri/target/universal-apple-darwin/release/bundle/dmg'
          shopt -s nullglob
          dmgs=("$bundle_dir"/*.dmg)
          test "${#dmgs[@]}" -eq 1
          name='Agent-Manager-0.1.0-macOS-Universal.dmg'
          cp "${dmgs[0]}" "$artifact_dir/$name"
          test -s "$artifact_dir/$name"
          hash="$(shasum -a 256 "$artifact_dir/$name" | awk '{print tolower($1)}')"
          printf '%s  %s\n' "$hash" "$name" > "$artifact_dir/SHA256SUMS.txt"

      - name: Verify internal artifact
        shell: bash
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/internal-artifacts"
          name='Agent-Manager-0.1.0-macOS-Universal.dmg'
          shopt -s nullglob
          entries=("$dir"/*)
          names=()
          for path in "${entries[@]}"; do
            test -f "$path"
            names+=("${path##*/}")
          done
          actual="$(printf '%s\n' "${names[@]}" | sort | tr '\n' ' ' | sed 's/ $//')"
          test "$actual" = "$name SHA256SUMS.txt"
          test -s "$dir/$name"
          test -s "$dir/SHA256SUMS.txt"
          lines="$(wc -l < "$dir/SHA256SUMS.txt" | tr -d '[:space:]')"
          test "$lines" = 1
          line="$(cat "$dir/SHA256SUMS.txt")"
          [[ "$line" =~ ^([0-9a-f]{64})\ \ (Agent-Manager-0\.1\.0-macOS-Universal\.dmg)$ ]]
          test "${BASH_REMATCH[2]}" = "$name"
          fresh="$(shasum -a 256 "$dir/$name" | awk '{print tolower($1)}')"
          test "${BASH_REMATCH[1]}" = "$fresh"

      - name: Upload internal build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Manager-0.1.0-macOS-Universal-internal
          path: internal-artifacts/
          if-no-files-found: error
          retention-days: 7
